spring:
  application:
    name: reprotrail-server

reprotrail:
  ingest:
    max-trace-bytes: 1048576
  maintenance:
    enabled: false
    fixed-delay: PT15M
    retention: P30D
    retention-batch-size: 100
    reconciliation-stale-after: PT15M
    reconciliation-batch-size: 100
  replay:
    lease-duration: PT2M
    max-artifact-bytes: 5242880

management:
  endpoints:
    web:
      exposure:
        include: health,info
